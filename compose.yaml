services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: postgres
    environment:
      POSTGRES_DB: trouble_lab
      POSTGRES_PASSWORD: trouble
      POSTGRES_USER: trouble
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
  rabbitmq:
    image: 'rabbitmq:3.13-management-alpine'
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_PASS: trouble
      RABBITMQ_DEFAULT_USER: trouble
    ports:
      - '5672:5672'
      - '15672:15672'
  redis:
    image: 'redis:7-alpine'
    container_name: redis
    ports:
      - '6379:6379'

volumes:
  postgres-data:
