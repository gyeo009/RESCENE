basePath: /
definitions:
  dto.FileWriteRequest:
    properties:
      content:
        description: 파일에 기록할 텍스트 내용
        example: print('hello')
        type: string
      filename:
        description: 생성/수정할 파일명 및 상대 경로
        example: main.py
        type: string
    required:
    - content
    - filename
    type: object
  dto.SandboxCreateRequest:
    properties:
      scenario:
        description: 실행할 이미지/시나리오명
        example: python:3.10-alpine
        type: string
    required:
    - scenario
    type: object
  dto.SandboxRunRequest:
    properties:
      cmd:
        description: 실행할 명령어 및 인자 리스트
        example:
        - python
        - main.py
        items:
          type: string
        type: array
    required:
    - cmd
    type: object
  response.ErrorResponse:
    properties:
      error:
        description: 에러 상세 메시지
        example: invalid request parameters
        type: string
    type: object
  response.FileContentResponse:
    properties:
      content:
        description: 파일 텍스트 콘텐츠
        example: print(1)
        type: string
      filename:
        description: 파일명
        example: main.py
        type: string
    type: object
  response.FileListResponse:
    properties:
      files:
        description: 작업 공간 안의 모든 파일명 리스트
        items:
          type: string
        type: array
    type: object
  response.SandboxCreateResponse:
    properties:
      container_id:
        description: 구동된 런타임 컨테이너 식별자 ID
        example: container-uuid-123
        type: string
      sandbox_id:
        description: 생성된 고유 샌드박스(작업 공간) 식별자
        example: sandbox-uuid-123
        type: string
    type: object
  response.SandboxRunResponse:
    properties:
      output:
        description: 명령어 실행 후 표준출력/에러 결과
        example: |
          hello world
        type: string
    type: object
  response.SuccessResponse:
    properties:
      status:
        description: 성공 여부 상태 ("success")
        example: success
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Docker 샌드박스 컨테이너 관리를 위한 확장 가능한 API 서버입니다.
  title: Sandbox API
  version: "1.0"
paths:
  /sandbox:
    post:
      consumes:
      - application/json
      description: 지정된 이미지를 활용해 격리된 실행 환경 컨테이너를 올리고, 호스트에 마운트할 작업 폴더를 생성합니다.
      parameters:
      - description: 샌드박스 이미지/시나리오 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SandboxCreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SandboxCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 샌드박스 환경 생성
      tags:
      - sandbox
  /sandbox/{id}:
    delete:
      description: 샌드박스 컨테이너 작동을 멈추고 삭제한 뒤, 호스트의 작업 디렉토리를 비웁니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 샌드박스 완전 삭제 및 정리
      tags:
      - sandbox
  /sandbox/{id}/files:
    delete:
      description: 샌드박스 작업 폴더 내부의 특정 파일을 삭제합니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      - description: 삭제하려는 파일의 상대경로
        in: query
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 파일 삭제
      tags:
      - files
    get:
      description: 사용자가 샌드박스 내부에서 작성/수정한 파일 전체 경로들을 나열합니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FileListResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 샌드박스 내 파일 목록 조회
      tags:
      - files
    put:
      consumes:
      - application/json
      description: 샌드박스 작업 디렉토리에 임의의 파일을 생성하거나 파일의 내용을 변경합니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      - description: 작성할 파일 경로 및 본문 텍스트
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.FileWriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 파일 생성 및 저장
      tags:
      - files
  /sandbox/{id}/files/content:
    get:
      description: 특정 샌드박스의 개별 파일 내용을 텍스트로 읽어옵니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      - description: 조회하려는 파일의 상대경로
        in: query
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.FileContentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 파일 내용 상세 조회
      tags:
      - files
  /sandbox/{id}/logs:
    get:
      description: 샌드박스 컨테이너의 표준 출력 및 에러 출력을 조회합니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SandboxRunResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 샌드박스 컨테이너 로그 조회
      tags:
      - sandbox
  /sandbox/{id}/run:
    post:
      consumes:
      - application/json
      description: 구동 중인 샌드박스 컨테이너 내부에서 동기로 명령을 Exec하여 그 출력을 가져옵니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      - description: 실행 명령 정보
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SandboxRunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SandboxRunResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 샌드박스 내 명령어 실행
      tags:
      - sandbox
  /sandbox/{id}/stop:
    post:
      description: 작동 중인 샌드박스 컨테이너를 중지 상태로 변경합니다.
      parameters:
      - description: 샌드박스 식별 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 샌드박스 컨테이너 중지
      tags:
      - sandbox
swagger: "2.0"
