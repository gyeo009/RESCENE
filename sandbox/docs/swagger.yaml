basePath: /
definitions:
  dto.SandboxRunRequest:
    properties:
      scenario:
        description: 실행할 시나리오 이름 (필수)
        example: python-basic
        type: string
      user:
        description: 요청 사용자 식별자 (필수)
        example: test-user
        type: string
    required:
    - scenario
    - user
    type: object
  response.ErrorResponse:
    properties:
      error:
        description: 에러 상세 메시지
        example: invalid request parameters
        type: string
    type: object
  response.SandboxRunResponse:
    properties:
      container_id:
        description: 생성된 컨테이너 식별자 ID
        example: sandbox-test-user
        type: string
      status:
        description: 현재 컨테이너 상태
        example: running
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Docker 샌드박스 컨테이너 관리를 위한 확장 가능한 API 서버입니다.
  title: Sandbox API
  version: "1.0"
paths:
  /sandbox/run:
    post:
      consumes:
      - application/json
      description: 요청된 시나리오와 사용자 정보에 매칭되는 샌드박스 컨테이너를 구동합니다.
      parameters:
      - description: 샌드박스 실행 파라미터
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SandboxRunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.SandboxRunResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 샌드박스 컨테이너 실행
      tags:
      - sandbox
swagger: "2.0"
